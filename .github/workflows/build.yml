name: Build & Release Tic Tac Fusion

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Package & Create Installer (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore Tic-Tac-Fusion.sln

    - name: Build Solution
      run: dotnet build Tic-Tac-Fusion.sln -c Release --no-restore

    - name: Publish Standalone Executable
      run: >
        dotnet publish TicTacFusion/TicTacFusion.csproj
        -c Release
        -r win-x64
        --self-contained
        -p:PublishSingleFile=true
        -p:PublishReadyToRun=true
        -o ./publish

    - name: Package Standalone Portable ZIP
      shell: pwsh
      run: |
        $version = if ("${{ github.event.release.tag_name }}") { 
            "${{ github.event.release.tag_name }}" 
        } elseif ("${{ github.ref_name }}".StartsWith("v")) { 
            "${{ github.ref_name }}" 
        } else { 
            "v1.0.0" 
        }
        New-Item -ItemType Directory -Force -Path ./dist | Out-Null
        Compress-Archive -Path ./publish/* -DestinationPath "./dist/TicTacFusion-$version-Portable-win-x64.zip" -Force
        Write-Host "Created portable package: TicTacFusion-$version-Portable-win-x64.zip"

    - name: Install Inno Setup Compiler
      run: choco install innosetup --no-progress -y

    - name: Compile Windows Setup Installer (.exe)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path ./installer-output | Out-Null
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        Write-Host "Windows Setup installer successfully created in ./installer-output/"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TicTacFusion-Packages
        path: |
          ./dist/*.zip
          ./installer-output/*.exe
        retention-days: 14

    - name: Attach Assets to GitHub Release
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./dist/*.zip
          ./installer-output/*.exe
        draft: false
        prerelease: false
        generate_release_notes: true
