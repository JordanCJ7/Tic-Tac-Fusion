name: Build & Release Tic Tac Fusion

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore Tic-Tac-Fusion.sln

    - name: Build Solution
      run: dotnet build Tic-Tac-Fusion.sln -c Release --no-restore

    - name: Publish Standalone Executable
      run: >
        dotnet publish TicTacFusion/TicTacFusion.csproj
        -c Release
        -r win-x64
        --self-contained
        -p:PublishSingleFile=true
        -p:PublishReadyToRun=true
        -o ./publish

    - name: Package Standalone ZIP
      shell: pwsh
      run: |
        $tag = if ("${{ github.ref_name }}".StartsWith("v")) { "${{ github.ref_name }}" } else { "latest" }
        $zipName = "TicTacFusion-$tag-Standalone-win-x64.zip"
        New-Item -ItemType Directory -Force -Path ./dist | Out-Null
        Compress-Archive -Path ./publish/* -DestinationPath "./dist/$zipName" -Force
        Write-Host "Created archive: $zipName"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TicTacFusion-Build
        path: ./dist/*.zip
        retention-days: 14

    - name: Publish GitHub Release Asset (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ./dist/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
